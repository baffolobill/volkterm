name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to show it
      placeholder: |
        1. …
        2. …
  - type: input
    id: version
    attributes:
      label: VolkTerm version
      description: VolkTerm ▸ About, or `volktermctl version`.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.7, Apple Silicon
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Optional: `log show --predicate 'subsystem BEGINSWITH \"com.volkoffhq.volkterm\"' --info --last 30m` around the moment it happened."
      render: text
